name: Docker Build Checks

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  # JOB 1: Validación con docker/build (comando directo)
  validate-with-build:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Ejecutar comprobaciones con docker build
        run: docker build --check .

  # JOB 2: Validación con docker/bake
  validate-with-bake:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Ejecutar comprobaciones con docker bake
        uses: docker/bake-action@v5
        with:
          files: docker-bake.hcl
          targets: validate
          call: checks